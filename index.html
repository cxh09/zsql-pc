<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智拾清澜工作台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tdesign-vue-next/dist/tdesign.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding-top: 50px;
    }

    /* ========== 登录页 ========== */
    .login-page {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      color: white;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .login-section {
      width: 480px;
      min-width: 480px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: #6b7280;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .login-button {
      margin-top: 8px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: #6b7280;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(0, 0, 0, 0.1);
    }

    .divider span {
      padding: 0 16px;
    }

    .qr-login-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-code-box-large {
      width: 220px;
      height: 220px;
      padding: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .switch-login-type {
      margin-top: 16px;
    }

    /* 深色模式适配 */
    .tdesign-theme__dark .login-section {
      background: rgba(30, 30, 30, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tdesign-theme__dark .login-header h1 {
      color: #f1f5f9;
    }

    .tdesign-theme__dark .login-header p {
      color: #94a3b8;
    }

    .tdesign-theme__dark .divider span {
      color: #94a3b8;
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .login-page .brand-section {
        display: none;
      }
      .login-page .login-section {
        width: 100%;
        min-width: unset;
      }
    }

    /* ========== 浏览器风格标题栏 ========== */
    .browser-title-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: var(--td-bg-color-container);
      border-bottom: 1px solid var(--td-border-level-1-color);
      display: flex;
      align-items: center;
      z-index: 1000;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* 标题栏品牌 */
    .title-bar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 550;
      color: var(--td-text-color-primary);
      flex-shrink: 0;
    }

    .title-bar-brand img {
      width: 24px;
      height: 24px;
    }

    /* 浏览器风格标签栏 */
    .browser-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 4px 0 4px;
      scroll-behavior: smooth;
    }

    .browser-tabs::-webkit-scrollbar {
      display: none;
    }

    /* TransitionGroup 动画 */
    .tab-enter-active {
      animation: tabEnter 0.25s ease-out;
    }
    .tab-leave-active {
      animation: tabLeave 0.2s ease-in;
    }
    .tab-move {
      transition: transform 0.25s ease;
    }

    @keyframes tabEnter {
      from {
        opacity: 0;
        transform: translateX(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes tabLeave {
      from {
        opacity: 1;
        transform: scale(1);
      }
      to {
        opacity: 0;
        transform: scale(0.85);
      }
    }

    .browser-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      min-width: 150px;
      max-width: 300px;
      height: 32px;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: var(--td-text-color-secondary);
      position: relative;
      transition: all 0.2s;
      border: 1px solid transparent;
      border-bottom: none;
      -webkit-app-region: no-drag;
    }

    .browser-tab:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .browser-tab.active {
      background: var(--td-bg-color-page);
      color: var(--td-text-color-primary);
      border-color: var(--td-border-level-1-color);
      border-bottom: 1px solid var(--td-bg-color-page);
      margin-bottom: -1px;
      z-index: 1;
    }

    /* 活跃标签底部指示条动画 */
    .browser-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 8px;
      right: 8px;
      height: 2px;
      background: var(--td-brand-color, #0052d9);
      border-radius: 1px 1px 0 0;
      animation: activeIndicator 0.3s ease-out;
    }

    @keyframes activeIndicator {
      from {
        opacity: 0;
        transform: scaleX(0);
      }
      to {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    .browser-tab-icon {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .browser-tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .browser-tab-close {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .browser-tab:hover .browser-tab-close,
    .browser-tab.active .browser-tab-close {
      opacity: 1;
    }

    .browser-tab-close:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    /* 标签栏工具 */
    .tab-bar-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .tab-tool-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      color: var(--td-text-color-secondary);
      transition: all 0.2s;
    }

    .tab-tool-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-text-color-primary);
    }

    /* 窗口控制按钮 */
    .title-bar-window-controls {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .window-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--td-text-color-primary);
    }

    .window-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .window-btn.close:hover {
      background: #e81123;
      color: white;
    }

    .window-btn svg {
      width: 10px;
      height: 10px;
    }

    /* ========== 工作台 ========== */
    .workbench-page {
      width: 100%;
      height: 100%;
      display: flex;
    }

    /* 侧边栏 */
    .sidebar {
      width: 64px;
      background: var(--td-bg-color-container);
      border-right: 1px solid var(--td-border-level-1-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 8px;
    }

    .sidebar-item {
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--td-text-color-secondary);
      transition: all 0.2s;
    }

    .sidebar-item:hover {
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-text-color-primary);
    }

    .sidebar-item.active {
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .sidebar-item svg {
      width: 20px;
      height: 20px;
    }

    .sidebar-item span {
      font-size: 11px;
    }

    /* 二级菜单 */
    .sidebar-item.has-submenu {
      position: relative;
    }

    .submenu {
      position: absolute;
      left: 48px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--td-bg-color-container);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      padding: 8px 0;
      min-width: 150px;
      z-index: 1000;
      border: 1px solid var(--td-border-level-1-color);
      margin-left: 8px;
    }

    /* 二级菜单与侧边栏的连接区域 */
    .submenu::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 0;
      bottom: 0;
      width: 8px;
    }

    .submenu-item {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 13px;
      color: var(--td-text-color-primary);
      transition: background 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .submenu-item:hover {
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-brand-color);
    }

    .submenu-item svg {
      flex-shrink: 0;
    }

    /* 内容区域 */
    .content-area {
      flex: 1;
      display: flex;
      background: var(--td-bg-color-page);
    }

    /* webview 容器 */
    .webview-container {
      flex: 1;
      position: relative;
    }

    /* 浏览器URL输入界面 */
    .browser-url-input-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--td-bg-color-page);
      z-index: 10;
    }

    .browser-url-input-wrapper {
      width: 600px;
      max-width: 90%;
    }

    .browser-input-with-suggestions {
      position: relative;
    }

    /* 搜索建议下拉列表 */
    .browser-suggestions {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--td-bg-color-container);
      border: 1px solid var(--td-border-level-1-color);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      z-index: 100;
      overflow: hidden;
      animation: suggestionsEnter 0.2s ease-out;
    }

    @keyframes suggestionsEnter {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .browser-suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-bottom: 1px solid var(--td-border-level-1-color);
    }

    .browser-suggestion-item:last-child {
      border-bottom: none;
    }

    .browser-suggestion-item:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .browser-suggestion-item.suggestion-visit {
      color: var(--td-brand-color);
    }

    .browser-suggestion-item.suggestion-search {
      color: var(--td-text-color-primary);
    }

    .suggestion-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .browser-suggestion-item:hover .suggestion-icon {
      opacity: 1;
    }

    .suggestion-text {
      flex: 1;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .suggestion-type-tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-text-color-secondary);
      flex-shrink: 0;
    }

    .browser-suggestion-item.suggestion-visit .suggestion-type-tag {
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .page-webview {
      border: none;
      /* 用 visibility/opacity 替代 display:none，避免 Electron webview 切换后尺寸不刷新 */
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* 浏览器输入页面时隐藏webview */
    .browser-url-input-container ~ .page-webview {
      display: none;
    }

    .page-webview.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      z-index: 1;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--td-text-color-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* 侧边栏底部用户菜单 */
    .sidebar-bottom {
      margin-top: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar-user-btn {
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--td-text-color-secondary);
      transition: all 0.2s;
    }

    .sidebar-user-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-text-color-primary);
    }

    .sidebar-user-btn svg {
      width: 20px;
      height: 20px;
    }

    .sidebar-user-btn span {
      font-size: 11px;
    }

    /* 用户下拉菜单 */
    .user-dropdown {
      position: absolute;
      left: 68px;
      bottom: 0;
      width: 160px;
      background: var(--td-bg-color-container);
      border: 1px solid var(--td-border-level-1-color);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      z-index: 2000;
      padding: 4px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: all 0.2s ease;
    }

    .user-dropdown.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .user-dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: var(--td-text-color-primary);
      transition: background 0.15s;
    }

    .user-dropdown-item:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .user-dropdown-item svg {
      width: 16px;
      height: 16px;
      color: var(--td-text-color-secondary);
      flex-shrink: 0;
    }

    .user-dropdown-divider {
      height: 1px;
      background: var(--td-border-level-1-color);
      margin: 4px 0;
    }

    .user-dropdown-item.danger {
      color: var(--td-error-color, #e34d59);
    }

    .user-dropdown-item.danger svg {
      color: var(--td-error-color, #e34d59);
    }

    .user-dropdown-item.danger:hover {
      background: var(--td-error-color-focus, rgba(227, 77, 89, 0.1));
    }

    /* 菜单下拉 */
    .menu-dropdown {
      position: absolute;
      left: 56px;
      bottom: 0;
      width: 140px;
      background: var(--td-bg-color-container);
      border: 1px solid var(--td-border-level-1-color);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      z-index: 2000;
      padding: 4px;
      opacity: 0;
      visibility: hidden;
      transform: translateX(-4px) translateY(4px);
      transition: all 0.2s ease;
    }

    .menu-dropdown.open {
      opacity: 1;
      visibility: visible;
      transform: translateX(0) translateY(0);
    }

    .menu-dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: var(--td-text-color-primary);
      transition: background 0.15s;
    }

    .menu-dropdown-item:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .menu-dropdown-divider {
      height: 1px;
      background: var(--td-border-level-1-color);
      margin: 4px 0;
    }

    .menu-dropdown-item.danger {
      color: var(--td-error-color, #e34d59);
    }

    .menu-dropdown-item.danger:hover {
      background: var(--td-error-color-focus, rgba(227, 77, 89, 0.1));
    }

    .sidebar {
      position: relative;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 浏览器 URL 输入对话框 -->
    <t-dialog
      v-model:visible="browserDialog.visible"
      header="打开网页"
      :confirm-btn="{ content: '打开', theme: 'primary' }"
      cancel-btn="取消"
      @confirm="confirmBrowserUrl"
    >
      <t-input
        v-model="browserDialog.url"
        placeholder="请输入网址，如 https://www.baidu.com"
        size="large"
        autofocus
        @keyup.enter="confirmBrowserUrl"
        style="margin-top: 8px;"
      >
        <template #prefix-icon>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </template>
      </t-input>
    </t-dialog>

    <!-- 小程序二维码弹窗 -->
    <t-dialog
      v-model:visible="showQRCodeDialog"
      header="访问小程序版本"
      :confirm-btn="null"
      cancel-btn="关闭"
      width="360px"
    >
      <div style="text-align: center; padding: 20px;">
        <img src="https://res.wx.qq.com/mmspraiweb_node/dist/static/img/cusqrcode.6cab1e1.jpg" alt="小程序二维码" style="width: 200px; height: 200px; border-radius: 8px;" />
        <p style="margin-top: 16px; color: #666; font-size: 14px;">微信扫码访问小程序版本</p>
      </div>
    </t-dialog>

    <!-- ===== 浏览器风格标题栏 ===== -->
    <div class="browser-title-bar">
      <div class="title-bar-brand">
        <img src="https://www.electronjs.org/zh/assets/img/logo.svg" alt="Electron" />
        <span>智拾清澜工作台</span>
      </div>
      <!-- 登录后显示标签页 -->
      <template v-if="isLoggedIn">
        <TransitionGroup name="tab" tag="div" class="browser-tabs">
          <div
            v-for="tab in tabs"
            :key="tab.id"
            class="browser-tab"
            :class="{ active: activeTab === tab.id }"
            @click="switchTab(tab.id)"
          >
            <div class="browser-tab-icon">
              <img v-if="tab.icon && tab.icon.startsWith('http')" :src="tab.icon" width="14" height="14" style="border-radius: 2px;" @error="tab.icon = ''" />
              <svg v-else width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" v-if="tab.icon === 'home'"/>
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" v-if="tab.icon === 'file'"/>
                <circle cx="12" cy="12" r="3" v-if="tab.icon === 'settings'"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" v-if="tab.icon === 'settings'"/>
                <circle cx="12" cy="12" r="10" v-if="!tab.icon || !['home','file','settings'].includes(tab.icon)"></circle>
              </svg>
            </div>
            <span class="browser-tab-title">{{ tab.title }}</span>
            <div class="browser-tab-close" @click.stop="closeTab(tab.id)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </div>
          </div>
        </TransitionGroup>
        <div class="tab-bar-tools">
          <div class="tab-tool-btn" @click="refreshActiveTab" title="刷新">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </div>
        </div>
      </template>
      <!-- 登录页面占位 -->
      <div v-else style="flex: 1;"></div>
      <div class="title-bar-window-controls">
        <div class="window-btn minimize" @click="minimizeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="window-btn maximize" @click="maximizeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          </svg>
        </div>
        <div class="window-btn close" @click="closeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      </div>
    </div>

    <!-- ===== 登录页 ===== -->
    <div v-if="!isLoggedIn" class="login-page">
      <img src="assets/bgpic.png" alt="banner" class="bg-image" onerror="this.style.display='none'">

      <div class="brand-section"></div>

      <div class="login-section">
        <div class="login-card">
          <!-- 二维码登录 -->
          <div v-if="showQRCode" class="qr-login-section">
            <div class="login-header">
              <h1>扫码登录</h1>
              <p>请使用App扫一扫登录</p>
            </div>
            <div class="qr-code-box-large">
              <svg width="200" height="200" viewBox="0 0 120 120">
                <rect x="5" y="5" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="4"/>
                <rect x="75" y="5" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="4"/>
                <rect x="5" y="75" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="4"/>
                <rect x="12" y="12" width="26" height="26" fill="#1f2937"/>
                <rect x="82" y="12" width="26" height="26" fill="#1f2937"/>
                <rect x="12" y="82" width="26" height="26" fill="#1f2937"/>
                <rect x="19" y="19" width="12" height="12" fill="white"/>
                <rect x="89" y="19" width="12" height="12" fill="white"/>
                <rect x="19" y="89" width="12" height="12" fill="white"/>
                <rect x="55" y="10" width="8" height="8" fill="#1f2937"/>
                <rect x="55" y="25" width="8" height="8" fill="#1f2937"/>
                <rect x="55" y="40" width="8" height="8" fill="#1f2937"/>
                <rect x="10" y="55" width="8" height="8" fill="#1f2937"/>
                <rect x="25" y="55" width="8" height="8" fill="#1f2937"/>
                <rect x="40" y="55" width="8" height="8" fill="#1f2937"/>
                <rect x="55" y="55" width="50" height="50" fill="#1f2937"/>
                <rect x="60" y="60" width="40" height="40" fill="white"/>
                <rect x="70" y="70" width="20" height="20" fill="#1f2937"/>
              </svg>
            </div>
            <div class="switch-login-type">
              <t-link theme="primary" @click="handleQRLogin">使用账号密码登录</t-link>
            </div>
          </div>

          <!-- 账号密码登录 -->
          <div v-else class="account-login-section">
            <div class="login-header">
              <h1>欢迎使用</h1>
              <p>请登录您的账户以继续</p>
            </div>

            <div class="login-form">
              <t-input
                v-model="formData.username"
                placeholder="请输入用户名/邮箱"
                size="large"
                clearable
              >
                <template #prefix-icon>
                  <t-icon name="user" />
                </template>
              </t-input>

              <t-input
                v-model="formData.password"
                type="password"
                placeholder="请输入密码"
                size="large"
                clearable
              >
                <template #prefix-icon>
                  <t-icon name="lock-on" />
                </template>
              </t-input>

              <div class="form-options">
                <t-checkbox v-model="formData.remember">记住我</t-checkbox>
                <t-link theme="primary" hover="color">忘记密码?</t-link>
              </div>

              <t-button
                theme="primary"
                size="large"
                block
                :loading="loading"
                @click="handleLogin"
                class="login-button"
              >
                登录
              </t-button>
            </div>

            <div class="divider">
              <span>或使用以下方式登录</span>
            </div>

            <t-button
              theme="default"
              variant="outline"
              size="large"
              block
              @click="handleQRLogin"
            >
              <template #icon>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7" rx="1" />
                  <rect x="14" y="3" width="7" height="7" rx="1" />
                  <rect x="3" y="14" width="7" height="7" rx="1" />
                  <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
              </template>
              扫码登录
            </t-button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 工作台 ===== -->
    <div v-else class="workbench-page">
      <!-- 侧边栏 -->
      <div class="sidebar">
        <div
          class="sidebar-item"
          :class="{ active: isTabOpen(null, 'dashboard') }"
          @click="openTab('主页', './pages/dashboard.html', 'home', 'dashboard')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          <span>主页</span>
        </div>
        <div
          class="sidebar-item"
          :class="{ active: isTabOpen(null, 'applications') }"
          @click="openTab('预约查看', './pages/applications.html', 'file', 'applications')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>预约</span>
        </div>
        <div
          class="sidebar-item"
          :class="{ active: isTabOpen(null, 'settings') }"
          @click="openTab('系统设置', './pages/settings.html', 'settings', 'settings')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>设置</span>
        </div>
        <div
          class="sidebar-item has-submenu"
          :class="{ active: isTabOpen(null, 'customerService'), 'submenu-open': showCustomerSubmenu }"
          @mouseenter="showCustomerSubmenuDelayed"
          @mouseleave="hideCustomerSubmenuDelayed"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          <span>客户会话</span>
          <!-- 二级菜单 -->
          <div class="submenu" v-show="showCustomerSubmenu" @mouseenter="showCustomerSubmenuDelayed" @mouseleave="hideCustomerSubmenuDelayed">
            <div class="submenu-item" @click="openMiniProgramQRCode">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="bzvlogo-miniprogram"><path id="bzvfill1" d="M12 22C17.5229 22 22 17.5229 22 12C22 6.47715 17.5229 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5229 6.47715 22 12 22Z" fill="transparent"/><path id="bzvstroke1" d="M12 22C17.5229 22 22 17.5229 22 12C22 6.47715 17.5229 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5229 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="square"/><path id="bzvstroke2" d="M9 12.05C7.85888 12.2816 7 13.2905 7 14.5C7 15.8807 8.11929 17 9.5 17C10.8807 17 12 15.8807 12 14.5V9.5C12 8.11929 13.1193 7 14.5 7C15.8807 7 17 8.11929 17 9.5C17 10.7095 16.1411 11.7184 15 11.95" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></g></svg>
              <span>访问小程序版本</span>
            </div>
            <div class="submenu-item" @click="openTab('客户会话', 'https://chatbot.weixin.qq.com/@ideaaaf6b/platform/statistic/customerService', 'message', 'customerService')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="byqlogo-chrome"><path id="byqfill1" d="M22.0034 12.002C22.0034 17.5248 17.5263 22.002 12.0034 22.002C6.48057 22.002 2.00342 17.5248 2.00342 12.002C2.00342 6.47911 6.48057 2.00195 12.0034 2.00195C17.5263 2.00195 22.0034 6.47911 22.0034 12.002Z" fill="transparent"/><ellipse id="byqfill2" cx="12.0013" cy="12.0007" rx="4.00125" ry="4.00075" fill="transparent"/><path id="byqstroke1" d="M13 7.99915L20.6673 7.99915M15.05 14.7133L11.1285 21.5055M4.20264 6.49633L8.125 13.2901M16.0025 12.0008C16.0025 14.2103 14.2111 16.0015 12.0013 16.0015C9.79142 16.0015 8 14.2103 8 12.0008C8 9.79122 9.79142 8.00002 12.0013 8.00002C14.2111 8.00002 16.0025 9.79122 16.0025 12.0008ZM22.0034 12.002C22.0034 17.5248 17.5263 22.002 12.0034 22.002C6.48057 22.002 2.00342 17.5248 2.00342 12.002C2.00342 6.4791 6.48057 2.00195 12.0034 2.00195C17.5263 2.00195 22.0034 6.4791 22.0034 12.002Z" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></g></svg>
              <span>使用网页版</span>
            </div>
          </div>
        </div>
        <div
          class="sidebar-item"
          :class="{ active: isBrowserTabActive }"
          @click="openBrowserDialog"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span>浏览器</span>
        </div>

        <!-- 底部菜单 -->
        <div class="sidebar-bottom">
          <div class="sidebar-item" @click="toggleMenu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
          </div>

          <!-- 菜单下拉 -->
          <div class="menu-dropdown" :class="{ open: showMenu }" @click.stop>
            <div class="menu-dropdown-item" @click="openAccountInfo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span>管理员</span>
            </div>
            <div class="menu-dropdown-item" @click="openUserSettings">
              <span>系统设置</span>
            </div>
            <div class="menu-dropdown-divider"></div>
            <div class="menu-dropdown-item danger" @click="handleLogout">
              <span>退出账号</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 内容区域 -->
      <div class="content-area">
        <div v-if="tabs.length === 0" class="empty-state"></div>
        <div v-else class="webview-container">
          <!-- 浏览器URL输入界面 -->
          <div v-if="isBrowserInputPage" class="browser-url-input-container">
            <div class="browser-url-input-wrapper">
              <div class="browser-input-with-suggestions">
                <t-input
                  v-model="browserInputUrl"
                  placeholder="请输入网址或搜索内容"
                  size="large"
                  autofocus
                  @keyup.enter="confirmBrowserUrl"
                  @focus="showBrowserSuggestions && browserSuggestions.length > 0 && (showBrowserSuggestions = true)"
                >
                  <template #prefix-icon>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/>
                      <line x1="2" y1="12" x2="22" y2="12"/>
                      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                  </template>
                  <template #suffix-icon>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="cursor: pointer;" @click="confirmBrowserUrl">
                      <circle cx="11" cy="11" r="8"/>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                  </template>
                </t-input>
                <!-- 搜索建议下拉列表 -->
                <div v-if="showBrowserSuggestions && browserSuggestions.length > 0" class="browser-suggestions">
                  <div
                    v-for="(suggestion, index) in browserSuggestions"
                    :key="index"
                    class="browser-suggestion-item"
                    :class="{ 'suggestion-visit': suggestion.type === 'visit', 'suggestion-search': suggestion.type === 'search' }"
                    @click="selectBrowserSuggestion(suggestion)"
                  >
                    <div class="suggestion-icon">
                      <svg v-if="suggestion.type === 'visit'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                      </svg>
                      <svg v-else width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                      </svg>
                    </div>
                    <div class="suggestion-text">{{ suggestion.title }}</div>
                    <div class="suggestion-type-tag">{{ suggestion.type === 'visit' ? '访问' : '搜索' }}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <template v-for="tab in tabs" :key="tab.id">
            <webview
              v-if="!tab.url.startsWith('browser://')"
              :src="tab.url"
              class="page-webview"
              :class="{ active: activeTab === tab.id }"
              nodeintegration="false"
              webpreferences="contextIsolation=true"
              allowpopups
              javascript="yes"
              useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
            ></webview>
          </template>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tdesign-vue-next/dist/tdesign.min.js"></script>
  <script src="renderer.js"></script>
  <script>
  </script>
</body>
</html>
