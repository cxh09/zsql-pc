<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智拾清澜工作台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tdesign-vue-next/dist/tdesign.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding-top: 50px;
    }

    /* 免费版试用水印 */
    .watermark {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .watermark-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 48px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.08);
      white-space: nowrap;
      user-select: none;
      letter-spacing: 8px;
    }

    .tdesign-theme__dark .watermark-content {
      color: rgba(255, 255, 255, 0.08);
    }

    /* ========== 登录页 ========== */
    .login-page {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      color: white;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .login-section {
      width: 480px;
      min-width: 480px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: #6b7280;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .login-button {
      margin-top: 8px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      color: #6b7280;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(0, 0, 0, 0.1);
    }

    .divider span {
      padding: 0 16px;
    }

    .qr-login-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-code-box-large {
      width: 220px;
      height: 220px;
      padding: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .switch-login-type {
      margin-top: 16px;
    }

    /* 深色模式适配 */
    .tdesign-theme__dark .login-section {
      background: rgba(30, 30, 30, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tdesign-theme__dark .login-header h1 {
      color: #f1f5f9;
    }

    .tdesign-theme__dark .login-header p {
      color: #94a3b8;
    }

    .tdesign-theme__dark .divider span {
      color: #94a3b8;
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .login-page .brand-section {
        display: none;
      }
      .login-page .login-section {
        width: 100%;
        min-width: unset;
      }
    }

    /* ========== 浏览器风格标题栏 ========== */
    .browser-title-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: var(--td-bg-color-container);
      border-bottom: 1px solid var(--td-border-level-1-color);
      display: flex;
      align-items: center;
      z-index: 1000;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* 标题栏品牌 */
    .title-bar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--td-text-color-primary);
      flex-shrink: 0;
    }

    .title-bar-brand img {
      width: 16px;
      height: 16px;
    }

    /* 浏览器风格标签栏 */
    .browser-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 4px 0 4px;
      -webkit-app-region: no-drag;
    }

    .browser-tabs::-webkit-scrollbar {
      display: none;
    }

    .browser-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      min-width: 100px;
      max-width: 160px;
      height: 32px;
      background: transparent;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 12px;
      color: var(--td-text-color-secondary);
      position: relative;
      transition: all 0.2s;
      border: 1px solid transparent;
      border-bottom: none;
    }

    .browser-tab:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .browser-tab.active {
      background: var(--td-bg-color-page);
      color: var(--td-text-color-primary);
      border-color: var(--td-border-level-1-color);
      border-bottom: 1px solid var(--td-bg-color-page);
      margin-bottom: -1px;
      z-index: 1;
    }

    .browser-tab-icon {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .browser-tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .browser-tab-close {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .browser-tab:hover .browser-tab-close,
    .browser-tab.active .browser-tab-close {
      opacity: 1;
    }

    .browser-tab-close:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    /* 新建标签按钮 */
    .new-tab-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      color: var(--td-text-color-secondary);
      transition: all 0.2s;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .new-tab-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-text-color-primary);
    }

    /* 标签栏工具 */
    .tab-bar-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .tab-tool-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      color: var(--td-text-color-secondary);
      transition: all 0.2s;
    }

    .tab-tool-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-text-color-primary);
    }

    /* 窗口控制按钮 */
    .title-bar-window-controls {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .window-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--td-text-color-primary);
    }

    .window-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .window-btn.close:hover {
      background: #e81123;
      color: white;
    }

    .window-btn svg {
      width: 10px;
      height: 10px;
    }

    /* ========== 工作台 ========== */
    .workbench-page {
      width: 100%;
      height: 100%;
      display: flex;
    }

    /* 侧边栏 */
    .sidebar {
      width: 64px;
      background: var(--td-bg-color-container);
      border-right: 1px solid var(--td-border-level-1-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 8px;
    }

    .sidebar-item {
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--td-text-color-secondary);
      transition: all 0.2s;
    }

    .sidebar-item:hover {
      background: var(--td-bg-color-secondarycontainer);
      color: var(--td-text-color-primary);
    }

    .sidebar-item.active {
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .sidebar-item svg {
      width: 20px;
      height: 20px;
    }

    .sidebar-item span {
      font-size: 11px;
    }

    /* 内容区域 */
    .content-area {
      flex: 1;
      position: relative;
      background: var(--td-bg-color-page);
    }

    /* webview 容器 - 使用 absolute 定位确保 webview 填充整个 content-area */
    .webview-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .page-webview {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: none;
      display: none;
    }

    .page-webview.active {
      display: block;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--td-text-color-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 免费版试用水印 -->
    <div class="watermark">
      <div class="watermark-content">免费版试用</div>
    </div>

    <!-- ===== 浏览器风格标题栏 ===== -->
    <div class="browser-title-bar">
      <div class="title-bar-brand">
        <img src="https://www.electronjs.org/zh/assets/img/logo.svg" alt="Electron" />
        <span>智拾清澜工作台</span>
      </div>
      <!-- 登录后显示标签页 -->
      <template v-if="isLoggedIn">
        <div class="browser-tabs">
          <div
            v-for="tab in tabs"
            :key="tab.id"
            class="browser-tab"
            :class="{ active: activeTab === tab.id }"
            @click="switchTab(tab.id)"
          >
            <div class="browser-tab-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" v-if="tab.icon === 'home'"/>
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" v-if="tab.icon === 'file'"/>
                <circle cx="12" cy="12" r="3" v-if="tab.icon === 'settings'"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" v-if="tab.icon === 'settings'"/>
              </svg>
            </div>
            <span class="browser-tab-title">{{ tab.title }}</span>
            <div class="browser-tab-close" @click.stop="closeTab(tab.id)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </div>
          </div>
        </div>
        <div class="new-tab-btn" @click="openNewTab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="tab-bar-tools">
          <div class="tab-tool-btn" @click="refreshActiveTab" title="刷新">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </div>
        </div>
      </template>
      <!-- 登录页面占位 -->
      <div v-else style="flex: 1;"></div>
      <div class="title-bar-window-controls">
        <div class="window-btn minimize" @click="minimizeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="window-btn maximize" @click="maximizeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          </svg>
        </div>
        <div class="window-btn close" @click="closeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      </div>
    </div>

    <!-- ===== 登录页 ===== -->
    <div v-if="!isLoggedIn" class="login-page">
      <img src="assets/bgpic.png" alt="banner" class="bg-image" onerror="this.style.display='none'">

      <div class="brand-section"></div>

      <div class="login-section">
        <div class="login-card">
          <!-- 二维码登录 -->
          <div v-if="showQRCode" class="qr-login-section">
            <div class="login-header">
              <h1>扫码登录</h1>
              <p>请使用App扫一扫登录</p>
            </div>
            <div class="qr-code-box-large">
              <svg width="200" height="200" viewBox="0 0 120 120">
                <rect x="5" y="5" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="4"/>
                <rect x="75" y="5" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="4"/>
                <rect x="5" y="75" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="4"/>
                <rect x="12" y="12" width="26" height="26" fill="#1f2937"/>
                <rect x="82" y="12" width="26" height="26" fill="#1f2937"/>
                <rect x="12" y="82" width="26" height="26" fill="#1f2937"/>
                <rect x="19" y="19" width="12" height="12" fill="white"/>
                <rect x="89" y="19" width="12" height="12" fill="white"/>
                <rect x="19" y="89" width="12" height="12" fill="white"/>
                <rect x="55" y="10" width="8" height="8" fill="#1f2937"/>
                <rect x="55" y="25" width="8" height="8" fill="#1f2937"/>
                <rect x="55" y="40" width="8" height="8" fill="#1f2937"/>
                <rect x="10" y="55" width="8" height="8" fill="#1f2937"/>
                <rect x="25" y="55" width="8" height="8" fill="#1f2937"/>
                <rect x="40" y="55" width="8" height="8" fill="#1f2937"/>
                <rect x="55" y="55" width="50" height="50" fill="#1f2937"/>
                <rect x="60" y="60" width="40" height="40" fill="white"/>
                <rect x="70" y="70" width="20" height="20" fill="#1f2937"/>
              </svg>
            </div>
            <div class="switch-login-type">
              <t-link theme="primary" @click="handleQRLogin">使用账号密码登录</t-link>
            </div>
          </div>

          <!-- 账号密码登录 -->
          <div v-else class="account-login-section">
            <div class="login-header">
              <h1>欢迎使用</h1>
              <p>请登录您的账户以继续</p>
            </div>

            <div class="login-form">
              <t-input
                v-model="formData.username"
                placeholder="请输入用户名/邮箱"
                size="large"
                clearable
              >
                <template #prefix-icon>
                  <t-icon name="user" />
                </template>
              </t-input>

              <t-input
                v-model="formData.password"
                type="password"
                placeholder="请输入密码"
                size="large"
                clearable
              >
                <template #prefix-icon>
                  <t-icon name="lock-on" />
                </template>
              </t-input>

              <div class="form-options">
                <t-checkbox v-model="formData.remember">记住我</t-checkbox>
                <t-link theme="primary" hover="color">忘记密码?</t-link>
              </div>

              <t-button
                theme="primary"
                size="large"
                block
                :loading="loading"
                @click="handleLogin"
                class="login-button"
              >
                登录
              </t-button>
            </div>

            <div class="divider">
              <span>或使用以下方式登录</span>
            </div>

            <t-button
              theme="default"
              variant="outline"
              size="large"
              block
              @click="handleQRLogin"
            >
              <template #icon>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7" rx="1" />
                  <rect x="14" y="3" width="7" height="7" rx="1" />
                  <rect x="3" y="14" width="7" height="7" rx="1" />
                  <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
              </template>
              扫码登录
            </t-button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 工作台 ===== -->
    <div v-else class="workbench-page">
      <!-- 侧边栏 -->
      <div class="sidebar">
        <div
          class="sidebar-item"
          :class="{ active: isTabOpen('./pages/dashboard.html') }"
          @click="openTab('主页', './pages/dashboard.html', 'home')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          <span>主页</span>
        </div>
        <div
          class="sidebar-item"
          :class="{ active: isTabOpen('./pages/applications.html') }"
          @click="openTab('预约查看', './pages/applications.html', 'file')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>预约</span>
        </div>
        <div
          class="sidebar-item"
          :class="{ active: isTabOpen('./pages/settings.html') }"
          @click="openTab('系统设置', './pages/settings.html', 'settings')"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>

          <span>设置</span>
        </div>
      </div>

      <!-- 内容区域 -->
      <div class="content-area">
        <div v-if="tabs.length === 0" class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="9" x2="15" y2="9"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="11" y2="17"/>
          </svg>
          <p>点击左侧菜单打开页面</p>
        </div>
        <div v-else class="webview-container">
          <webview
            v-for="tab in tabs"
            :key="tab.id"
            :src="tab.url"
            class="page-webview"
            :class="{ active: activeTab === tab.id }"
            nodeintegration="false"
            webpreferences="contextIsolation=yes"
          ></webview>
        </div>
      </div>
    </div>
  </div>
