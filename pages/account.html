<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户信息 - 智拾清澜工作台</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../libs/tdesign.min.css" />
  <style>
    /* 防止页面闪烁 - 在CSS加载完成前隐藏内容 */
    html {
      visibility: hidden;
      opacity: 0;
    }
    html.loaded {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
  </style>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--td-bg-color-page);
      padding: 16px 24px;
    }

    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .page-header p {
      font-size: 14px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    /* 设置卡片 */
    .settings-container {
      flex: 1;
    }

    .settings-card {
      background: var(--td-bg-color-container);
      border-radius: 8px;
      border: 1px solid var(--td-border-level-1-color);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--td-border-level-1-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .settings-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .settings-card-subtitle {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .settings-card-body {
      padding: 20px;
    }

    /* 设置项 */
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--td-border-level-1-color);
    }

    .setting-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-item:first-child {
      padding-top: 0;
    }

    .setting-info {
      flex: 1;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--td-text-color-primary);
      margin-bottom: 4px;
    }

    .setting-desc {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .setting-control {
      margin-left: 16px;
    }

    /* 用户信息 */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 0;
    }

    .user-avatar-large {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
    }

    .user-profile-info {
      flex: 1;
    }

    .user-profile-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .user-profile-role {
      font-size: 13px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    /* 安全设置 */
    .security-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--td-border-level-1-color);
    }

    .security-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .security-item:first-child {
      padding-top: 0;
    }

    .security-info {
      flex: 1;
    }

    .security-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--td-text-color-primary);
      margin-bottom: 2px;
    }

    .security-status {
      font-size: 12px;
      color: var(--td-text-color-secondary);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .setting-item,
      .security-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .setting-control {
        margin-left: 0;
      }

      .user-profile {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>账户信息</h1>
      <p>管理您的个人资料和安全设置</p>
    </div>

    <div class="settings-container">
      <!-- 账户信息 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">基本信息</div>
            <div class="settings-card-subtitle">您的账户基本信息</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="user-profile">
            <div class="user-avatar-large">管</div>
            <div class="user-profile-info">
              <div class="user-profile-name">管理员</div>
              <div class="user-profile-role">超级管理员</div>
            </div>
            <t-button theme="primary" variant="outline" size="small">修改资料</t-button>
          </div>
        </div>
      </div>

      <!-- 登录凭证 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">登录凭证</div>
            <div class="settings-card-subtitle">账户安全相关设置</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="security-item">
            <div class="security-info">
              <div class="security-label">账户名称</div>
              <div class="security-status">admin</div>
            </div>
            <t-button theme="default" variant="outline" size="small">修改</t-button>
          </div>
          <div class="security-item">
            <div class="security-info">
              <div class="security-label">登录密码</div>
              <div class="security-status">已设置密码保护</div>
            </div>
            <t-button theme="default" variant="outline" size="small">修改密码</t-button>
          </div>
          <div class="security-item">
            <div class="security-info">
              <div class="security-label">记住登录</div>
              <div class="security-status">下次登录时自动填充账户信息</div>
            </div>
            <t-switch v-model="rememberLogin"></t-switch>
          </div>
        </div>
      </div>

      <!-- 会话管理 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">会话管理</div>
            <div class="settings-card-subtitle">管理当前登录状态</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">当前会话</div>
              <div class="setting-desc">查看当前登录设备信息</div>
            </div>
            <div class="setting-control">
              <t-button theme="danger" variant="outline" size="small" @click="logout">退出登录</t-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../libs/vue.global.js"></script>
  <script src="../libs/tdesign.min.js"></script>
  <script>
    const { createApp, ref, onMounted } = Vue;

    const App = {
      setup() {
        const rememberLogin = ref(true);

        // 加载保存的设置
        const loadSettings = () => {
          const saved = localStorage.getItem('savedCredentials');
          if (saved) {
            try {
              const credentials = JSON.parse(saved);
              rememberLogin.value = !!(credentials.username || credentials.password);
            } catch (e) {
              console.error('加载设置失败:', e);
            }
          }
        };

        // 保存设置
        const saveSettings = () => {
          if (!rememberLogin.value) {
            localStorage.removeItem('savedCredentials');
          }
        };

        // 监听记住登录变化
        const onRememberChange = (val) => {
          rememberLogin.value = val;
          saveSettings();
        };

        // 退出登录
        const logout = () => {
          TDesign.DialogPlugin.confirm({
            header: '确认退出登录',
            body: '退出登录后将返回登录页面，是否继续？',
            onConfirm: () => {
              localStorage.removeItem('savedCredentials');
              // 通知主窗口退出登录
              if (window.electronAPI?.logout) {
                window.electronAPI.logout();
              } else {
                // 浏览器中直接刷新
                location.reload();
              }
            }
          });
        };

        onMounted(() => {
          loadSettings();
        });

        return {
          rememberLogin,
          logout
        };
      }
    };

    const app = createApp(App);
    app.use(TDesign);
    app.mount('#app');

    // CSS加载完成后显示页面
    window.addEventListener('load', () => {
      document.documentElement.classList.add('loaded');
    });
  </script>
</body>
</html>
