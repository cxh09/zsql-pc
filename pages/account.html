<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户信息 - 智拾清澜工作台</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../libs/tdesign.min.css" />
  <style>
    /* 防止页面闪烁 - 在CSS加载完成前隐藏内容 */
    html {
      visibility: hidden;
      opacity: 0;
    }
    html.loaded {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
  </style>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--td-bg-color-page);
      padding: 16px 24px;
    }

    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .page-header p {
      font-size: 14px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    /* 设置卡片 */
    .settings-container {
      flex: 1;
    }

    .settings-card {
      background: var(--td-bg-color-container);
      border-radius: 8px;
      border: 1px solid var(--td-border-level-1-color);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--td-border-level-1-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .settings-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .settings-card-subtitle {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .settings-card-body {
      padding: 20px;
    }

    /* 设置项 */
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--td-border-level-1-color);
    }

    .setting-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-item:first-child {
      padding-top: 0;
    }

    .setting-info {
      flex: 1;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--td-text-color-primary);
      margin-bottom: 4px;
    }

    .setting-desc {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .setting-control {
      margin-left: 16px;
    }

    /* 账户信息 */
    .account-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--td-text-color-primary);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .setting-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .setting-control {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>账户信息</h1>
      <p>管理您的账户设置</p>
    </div>

    <div class="settings-container">
      <!-- 账户名称 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20a6 6 0 0 0-12 0"/>
              <circle cx="12" cy="10" r="4"/>
              <circle cx="12" cy="12" r="10"/>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">账户名称</div>
            <div class="settings-card-subtitle">当前登录账户</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="setting-item">
            <div class="setting-info">
              <div class="account-name">{{ accountName }}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 记住账户 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">记住账户</div>
            <div class="settings-card-subtitle">下次登录时自动填充账户信息</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">自动填充</div>
              <div class="setting-desc">下次登录时自动填入账户名和密码</div>
            </div>
            <div class="setting-control">
              <t-switch v-model="rememberAccount"></t-switch>
            </div>
          </div>
        </div>
      </div>

      <!-- 修改密码 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">修改密码</div>
            <div class="settings-card-subtitle">更新您的登录密码</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-desc">定期更换密码可以提高账户安全性</div>
            </div>
            <div class="setting-control">
              <t-button theme="primary" variant="outline" size="small" @click="changePassword">修改密码</t-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../libs/vue.global.js"></script>
  <script src="../libs/tdesign.min.js"></script>
  <script>
    const { createApp, ref, onMounted } = Vue;

    const App = {
      setup() {
        const accountName = ref('admin');
        const rememberAccount = ref(false);

        // 加载保存的设置
        const loadSettings = () => {
          const saved = localStorage.getItem('savedCredentials');
          if (saved) {
            try {
              const credentials = JSON.parse(saved);
              accountName.value = credentials.username || 'admin';
              rememberAccount.value = !!(credentials.username || credentials.password);
            } catch (e) {
              console.error('加载设置失败:', e);
            }
          }
        };

        // 切换记住账户
        const toggleRemember = (val) => {
          const saved = localStorage.getItem('savedCredentials');
          let credentials = {};
          if (saved) {
            try {
              credentials = JSON.parse(saved);
            } catch (e) {}
          }
          if (val) {
            credentials.username = accountName.value;
            localStorage.setItem('savedCredentials', JSON.stringify(credentials));
          } else {
            localStorage.removeItem('savedCredentials');
          }
        };

        // 修改密码（占位）
        const changePassword = () => {
          TDesign.MessagePlugin.info('修改密码功能正在开发中...');
        };

        onMounted(() => {
          loadSettings();
        });

        return {
          accountName,
          rememberAccount,
          changePassword
        };
      }
    };

    const app = createApp(App);
    app.use(TDesign);
    app.mount('#app');

    // CSS加载完成后显示页面
    window.addEventListener('load', () => {
      document.documentElement.classList.add('loaded');
    });
  </script>
</body>
</html>
