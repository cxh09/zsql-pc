<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 - 智拾清澜工作台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tdesign-vue-next/dist/tdesign.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--td-bg-color-page);
      padding: 16px 24px;
    }

    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .page-header p {
      font-size: 14px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    /* 设置卡片 */
    .settings-container {
      flex: 1;
    }

    .settings-card {
      background: var(--td-bg-color-container);
      border-radius: 8px;
      border: 1px solid var(--td-border-level-1-color);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--td-border-level-1-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .settings-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .settings-card-subtitle {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .settings-card-body {
      padding: 20px;
    }

    /* 设置项 */
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--td-border-level-1-color);
    }

    .setting-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-item:first-child {
      padding-top: 0;
    }

    .setting-info {
      flex: 1;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--td-text-color-primary);
      margin-bottom: 4px;
    }

    .setting-desc {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .setting-control {
      margin-left: 16px;
    }

    /* 用户信息 */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 0;
    }

    .user-avatar-large {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
    }

    .user-profile-info {
      flex: 1;
    }

    .user-profile-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .user-profile-role {
      font-size: 13px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    /* 关于信息 */
    .about-info {
      text-align: center;
      padding: 24px;
    }

    .about-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: var(--td-brand-color-light);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--td-brand-color);
    }

    .about-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .about-version {
      font-size: 14px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    .about-desc {
      font-size: 13px;
      color: var(--td-text-color-secondary);
      margin-top: 16px;
      line-height: 1.6;
    }

    .about-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--td-border-level-1-color);
    }

    .about-link {
      font-size: 13px;
      color: var(--td-brand-color);
      cursor: pointer;
    }

    .about-link:hover {
      text-decoration: underline;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .setting-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .setting-control {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>系统设置</h1>
      <p>管理您的账户和系统偏好设置</p>
    </div>

    <div class="settings-container">
      <!-- 账户信息 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">账户信息</div>
            <div class="settings-card-subtitle">管理您的个人资料</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="user-profile">
            <div class="user-avatar-large">管</div>
            <div class="user-profile-info">
              <div class="user-profile-name">管理员</div>
              <div class="user-profile-role">超级管理员</div>
            </div>
            <t-button theme="primary" variant="outline" size="small">修改资料</t-button>
          </div>
        </div>
      </div>

      <!-- 数据管理 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">数据管理</div>
            <div class="settings-card-subtitle">管理本地数据</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">清除缓存</div>
              <div class="setting-desc">清除本地缓存数据，释放空间</div>
            </div>
            <div class="setting-control">
              <t-button theme="danger" variant="outline" size="small" @click="clearCache">清除</t-button>
            </div>
          </div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">导出数据</div>
              <div class="setting-desc">导出所有预约数据到本地</div>
            </div>
            <div class="setting-control">
              <t-button theme="primary" variant="outline" size="small" @click="exportData">导出</t-button>
            </div>
          </div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">自动刷新</div>
              <div class="setting-desc">定时自动刷新数据</div>
            </div>
            <div class="setting-control">
              <t-switch v-model="autoRefresh.enabled"></t-switch>
            </div>
          </div>
          <div v-if="autoRefresh.enabled" class="setting-item">
            <div class="setting-info">
              <div class="setting-label">刷新间隔</div>
              <div class="setting-desc">设置自动刷新时间间隔</div>
            </div>
            <div class="setting-control">
              <t-select v-model="autoRefresh.interval" style="width: 120px">
                <t-option :value="30" label="30秒"></t-option>
                <t-option :value="60" label="1分钟"></t-option>
                <t-option :value="300" label="5分钟"></t-option>
                <t-option :value="600" label="10分钟"></t-option>
              </t-select>
            </div>
          </div>
        </div>
      </div>

      <!-- 关于 -->
      <div class="settings-card">
        <div class="settings-card-body">
          <div class="about-info">
            <div class="about-logo">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
              </svg>
            </div>
            <div class="about-name">智拾清澜工作台</div>
            <div class="about-version">版本 1.0.0</div>
            <div class="about-desc">
              智拾清澜工作台是一款专业的打捞服务管理工具，<br>
              帮助您高效管理预约订单、客户信息和服务记录。
            </div>
            <div class="about-developer" style="margin-top: 12px; font-size: 12px; color: #999;">
              开发者：Github@cxh09，创客社24届学生cxh制作
            </div>
            <div class="about-links">
              <span class="about-link" @click="openLink('help')">使用帮助</span>
              <span class="about-link" @click="openLink('privacy')">隐私政策</span>
              <span class="about-link" @click="openLink('feedback')">反馈建议</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tdesign-vue-next/dist/tdesign.min.js"></script>
  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    const App = {
      setup() {
        const autoRefresh = reactive({
          enabled: false,
          interval: 60
        });

        // 加载保存的设置
        const loadSettings = () => {
          const saved = localStorage.getItem('appSettings');
          if (saved) {
            try {
              const settings = JSON.parse(saved);
              Object.assign(autoRefresh, settings.autoRefresh || {});
            } catch (e) {
              console.error('加载设置失败:', e);
            }
          }
        };

        // 保存设置
        const saveSettings = () => {
          const settings = {
            autoRefresh: { ...autoRefresh }
          };
          localStorage.setItem('appSettings', JSON.stringify(settings));
        };

        // 清除缓存
        const clearCache = () => {
          TDesign.DialogPlugin.confirm({
            header: '确认清除缓存',
            body: '清除缓存将删除所有本地存储的数据，是否继续？',
            onConfirm: () => {
              localStorage.clear();
              TDesign.MessagePlugin.success('缓存已清除');
              setTimeout(() => location.reload(), 1000);
            }
          });
        };

        // 导出数据
        const exportData = () => {
          const data = {
            settings: JSON.parse(localStorage.getItem('appSettings') || '{}'),
            credentials: JSON.parse(localStorage.getItem('savedCredentials') || '{}'),
            exportTime: new Date().toISOString()
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `智拾清澜设置备份_${new Date().toISOString().split('T')[0]}.json`;
          link.click();
          URL.revokeObjectURL(url);
          TDesign.MessagePlugin.success('设置导出成功');
        };

        // 打开链接
        const openLink = (type) => {
          const messages = {
            help: '使用帮助文档正在编写中...',
            privacy: '隐私政策页面正在编写中...',
            feedback: '感谢您的反馈！请发送邮件至 support@example.com'
          };
          TDesign.MessagePlugin.info(messages[type]);
        };

        // 监听设置变化
        const watchSettings = () => {
          saveSettings();
        };

        onMounted(() => {
          loadSettings();
        });

        return {
          autoRefresh,
          clearCache,
          exportData,
          openLink,
          watchSettings
        };
      }
    };

    const app = createApp(App);
    app.use(TDesign);
    app.mount('#app');
  </script>
</body>
</html>
