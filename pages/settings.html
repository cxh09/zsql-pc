<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 - 智拾清澜工作台</title>
  <link rel="icon" type="image/svg+xml" href="icon-settings.svg">
  <link rel="stylesheet" href="../libs/tdesign.min.css" />
  <style>
    /* 防止页面闪烁 - 在CSS加载完成前隐藏内容 */
    html {
      visibility: hidden;
      opacity: 0;
    }
    html.loaded {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
  </style>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--td-bg-color-page);
      padding: 16px 24px;
    }

    #app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .page-header p {
      font-size: 14px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    /* 设置卡片 */
    .settings-container {
      flex: 1;
    }

    .settings-card {
      background: var(--td-bg-color-container);
      border-radius: 8px;
      border: 1px solid var(--td-border-level-1-color);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .settings-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--td-border-level-1-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .settings-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .settings-card-subtitle {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .settings-card-body {
      padding: 20px;
    }

    /* 设置项 */
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--td-border-level-1-color);
    }

    .setting-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-item:first-child {
      padding-top: 0;
    }

    .setting-info {
      flex: 1;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--td-text-color-primary);
      margin-bottom: 4px;
    }

    .setting-desc {
      font-size: 13px;
      color: var(--td-text-color-secondary);
    }

    .setting-control {
      margin-left: 16px;
    }

    /* 关于信息 */
    .about-info {
      text-align: center;
      padding: 24px;
    }

    .about-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: var(--td-brand-color-light);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--td-brand-color);
    }

    .about-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--td-text-color-primary);
    }

    .about-version {
      font-size: 14px;
      color: var(--td-text-color-secondary);
      margin-top: 4px;
    }

    .about-desc {
      font-size: 13px;
      color: var(--td-text-color-secondary);
      margin-top: 16px;
      line-height: 1.6;
    }

    .about-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--td-border-level-1-color);
    }

    .about-link {
      font-size: 13px;
      color: var(--td-brand-color);
      cursor: pointer;
    }

    .about-link:hover {
      text-decoration: underline;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .setting-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .setting-control {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>系统设置</h1>
      <p>管理您的系统偏好设置</p>
    </div>

    <div class="settings-container">
      <!-- 账户设置 -->
      <div class="settings-card">
        <div class="settings-card-header">
          <div class="settings-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 20a6 6 0 0 0-12 0"/>
              <circle cx="12" cy="10" r="4"/>
              <circle cx="12" cy="12" r="10"/>
            </svg>
          </div>
          <div>
            <div class="settings-card-title">账户设置</div>
            <div class="settings-card-subtitle">管理您的账户信息</div>
          </div>
        </div>
        <div class="settings-card-body">
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">账户名称</div>
              <div class="setting-desc">{{ accountName }}</div>
            </div>
          </div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">账户信息</div>
              <div class="setting-desc">查看和修改账户详细信息</div>
            </div>
            <div class="setting-control">
              <t-button theme="primary" variant="outline" size="small" @click="openAccountInfo">进入</t-button>
            </div>
          </div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">记住账户信息</div>
              <div class="setting-desc">下次登录时自动填充账户信息</div>
            </div>
            <div class="setting-control">
              <t-switch v-model="rememberAccount"></t-switch>
            </div>
          </div>
          <div class="setting-item">
            <div class="setting-info">
              <div class="setting-label">退出账户</div>
              <div class="setting-desc">退出当前登录的账户</div>
            </div>
            <div class="setting-control">
              <t-button theme="danger" variant="outline" size="small" @click="logout">退出</t-button>
            </div>
          </div>
        </div>
      </div>

      <!-- 关于软件 -->
      <div class="settings-card">
        <div class="settings-card-body">
          <div class="about-info">
            <div class="about-logo">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
              </svg>
            </div>
            <div class="about-name">智拾清澜工作台</div>
            <div class="about-version">版本 2.0.0</div>
            <div class="about-desc">
              智拾清澜工作台是一款专业的打捞服务管理工具，<br>
              帮助您高效管理预约订单、客户信息和服务记录。
            </div>
            <div class="about-developer" style="margin-top: 12px; font-size: 12px; color: #999;">
              开发者：Github@cxh09，创客社24届学生cxh制作
            </div>
            <div class="about-links">
              <span class="about-link" @click="openLink('agreement')">用户协议</span>
              <span class="about-link" @click="openLink('privacy')">隐私政策</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../libs/vue.global.js"></script>
  <script src="../libs/tdesign.min.js"></script>
  <script>
    const { createApp, ref, onMounted } = Vue;

    const App = {
      setup() {
        const accountName = ref('admin');
        const rememberAccount = ref(false);

        // 加载保存的设置
        const loadSettings = () => {
          const saved = localStorage.getItem('savedCredentials');
          if (saved) {
            try {
              const credentials = JSON.parse(saved);
              accountName.value = credentials.username || 'admin';
              rememberAccount.value = !!(credentials.username || credentials.password);
            } catch (e) {
              console.error('加载设置失败:', e);
            }
          }
        };

        // 保存记住账户设置
        const saveRememberAccount = () => {
          const saved = localStorage.getItem('savedCredentials');
          let credentials = {};
          if (saved) {
            try {
              credentials = JSON.parse(saved);
            } catch (e) {}
          }
          if (rememberAccount.value) {
            credentials.username = accountName.value;
            localStorage.setItem('savedCredentials', JSON.stringify(credentials));
          } else {
            localStorage.removeItem('savedCredentials');
          }
        };

        // 监听记住账户变化
        const onRememberChange = (val) => {
          rememberAccount.value = val;
          saveRememberAccount();
        };

        // 打开账户信息页面
        const openAccountInfo = () => {
          if (window.electronAPI?.openTab) {
            window.electronAPI.openTab({ pageKey: 'account' })
          } else {
            window.open('./account.html', '_blank')
          }
        };

        // 退出登录
        const logout = () => {
          TDesign.DialogPlugin.confirm({
            header: '确认退出账户',
            body: '退出账户后将返回登录页面，是否继续？',
            onConfirm: () => {
              localStorage.removeItem('savedCredentials');
              if (window.electronAPI?.logout) {
                window.electronAPI.logout();
              } else {
                location.reload();
              }
            }
          });
        };

        // 打开链接
        const openLink = (type) => {
          if (window.electronAPI?.openTab) {
            const pageKey = type === 'privacy' ? 'privacy' : 'agreement'
            window.electronAPI.openTab({ pageKey })
          } else {
            window.open(`./agreement.html?tab=${type}`, '_blank');
          }
        };

        onMounted(() => {
          loadSettings();
        });

        return {
          accountName,
          rememberAccount,
          openAccountInfo,
          logout,
          openLink
        };
      }
    };

    const app = createApp(App);
    app.use(TDesign);
    app.mount('#app');

    // CSS加载完成后显示页面
    window.addEventListener('load', () => {
      document.documentElement.classList.add('loaded');
    });
  </script>
</body>
</html>
