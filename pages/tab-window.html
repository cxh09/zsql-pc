<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智拾清澜工作台</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../libs/tdesign.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding-top: 50px;
    }

    /* 浏览器风格标题栏 - 整个标题栏可拖动 */
    .browser-title-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: var(--td-bg-color-container);
      border-bottom: 1px solid var(--td-border-level-1-color);
      display: flex;
      align-items: center;
      z-index: 1000;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* 标签信息 - 可拖动 */
    .tab-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      -webkit-app-region: drag;
    }

    .tab-info-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-info-icon img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }

    .tab-info-title {
      font-size: 13px;
      color: var(--td-text-color-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 窗口控制按钮 */
    .title-bar-window-controls {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .window-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--td-text-color-primary);
    }

    .window-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .window-btn.close:hover {
      background: #e81123;
      color: white;
    }

    .window-btn svg {
      width: 10px;
      height: 10px;
    }

    /* 刷新按钮 */
    .refresh-btn {
      width: 46px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--td-text-color-primary);
      -webkit-app-region: no-drag;
    }

    .refresh-btn:hover {
      background: var(--td-bg-color-secondarycontainer);
    }

    .refresh-btn svg {
      width: 12px;
      height: 12px;
    }

    /* 内容区域 */
    .content-area {
      width: 100%;
      height: 100%;
      background: var(--td-bg-color-page);
    }

    .webview-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .page-webview {
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
    }

    /* 加载状态 */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--td-bg-color-page);
      z-index: 100;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--td-bg-color-secondarycontainer);
      border-top-color: var(--td-brand-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: var(--td-text-color-secondary);
    }

    /* 合并回主窗口按钮 - 不可拖动 */
    .merge-back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      margin-left: 16px;
      margin-right: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: var(--td-text-color-secondary);
      background: var(--td-bg-color-secondarycontainer);
      transition: all 0.2s;
      -webkit-app-region: no-drag;
      pointer-events: auto;
    }

    .merge-back-btn:hover {
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
    }

    .merge-back-btn svg {
      width: 14px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 浏览器风格标题栏 - 支持双击最大化 -->
    <div class="browser-title-bar" @dblclick="toggleMaximize">
      <!-- 合并回主窗口按钮 -->
      <div class="merge-back-btn" @click="mergeBackToMain" title="合并回主窗口">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span>返回主窗口</span>
      </div>

      <!-- 标签信息 -->
      <div class="tab-info">
        <div class="tab-info-icon">
          <img v-if="tabIcon && (tabIcon.startsWith('http') || tabIcon.startsWith('file://'))" :src="tabIcon" @error="tabIcon = 'globe'" />
          <svg v-else width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
            <path d="M2 12h20" />
          </svg>
        </div>
        <span class="tab-info-title">{{ tabTitle }}</span>
      </div>

      <!-- 刷新按钮 -->
      <div class="refresh-btn" @click="refreshPage" title="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </div>

      <!-- 窗口控制按钮 -->
      <div class="title-bar-window-controls">
        <div class="window-btn minimize" @click="minimizeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="window-btn maximize" @click="maximizeWindow">
          <svg v-if="!isMaximized" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          </svg>
          <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </div>
        <div class="window-btn close" @click="closeWindow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      </div>
    </div>

    <!-- 内容区域 -->
    <div class="content-area">
      <div class="webview-container">
        <!-- 加载状态 -->
        <div v-if="isLoading" class="loading-overlay">
          <div class="loading-spinner"></div>
          <div class="loading-text">正在加载...</div>
        </div>

        <!-- Webview -->
        <webview
          ref="webview"
          :src="tabUrl"
          class="page-webview"
          nodeintegration="false"
          webpreferences="contextIsolation=true"
          allowpopups
          javascript="yes"
          useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        ></webview>
      </div>
    </div>
  </div>

  <script src="../libs/vue.global.js"></script>
  <script src="../libs/tdesign.min.js"></script>
  <script>
    const { createApp, ref, onMounted } = Vue

    const App = {
      setup() {
        // 从 URL 参数获取标签页信息
        const urlParams = new URLSearchParams(window.location.search)
        const rawUrl = urlParams.get('url') || ''

        // 将相对路径转换为 file:// 绝对路径
        const resolveUrl = (url) => {
          // 如果是 http/https 或 file:// 开头，直接返回
          if (/^(https?:|file:)/i.test(url)) {
            return url
          }
          // 如果是相对路径，转换为 file:// 绝对路径
          if (url.startsWith('./') || url.startsWith('../')) {
            // 获取当前文件的目录路径
            const currentPath = window.location.href
            const baseUrl = currentPath.substring(0, currentPath.lastIndexOf('/') + 1)
            // 使用 URL 类解析相对路径
            const resolved = new URL(url, baseUrl).href
            return resolved
          }
          return url
        }

        const tabUrl = ref(resolveUrl(rawUrl))
        const tabTitle = ref(urlParams.get('title') || '新窗口')
        const tabIcon = ref(urlParams.get('icon') || 'home')
        const isLoading = ref(true)
        const webview = ref(null)

        // 窗口状态
        const isMaximized = ref(false)

        // 更新窗口状态
        const updateWindowState = async () => {
          if (window.electronAPI?.isMaximized) {
            isMaximized.value = await window.electronAPI.isMaximized()
          }
        }

        // 窗口控制
        const minimizeWindow = () => {
          if (window.electronAPI?.minimize) {
            window.electronAPI.minimize()
          }
        }

        const maximizeWindow = async () => {
          if (window.electronAPI?.maximize) {
            await window.electronAPI.maximize()
            await updateWindowState()
          }
        }

        // 双击切换最大化/还原
        const toggleMaximize = async () => {
          if (window.electronAPI?.maximize) {
            await window.electronAPI.maximize()
            await updateWindowState()
          }
        }

        const closeWindow = () => {
          if (window.electronAPI?.closeWindow) {
            window.electronAPI.closeWindow()
          }
        }

        // 合并回主窗口
        const mergeBackToMain = () => {
          // 向主窗口发送消息，请求合并
          if (window.electronAPI?.sendToMain) {
            window.electronAPI.sendToMain('merge-tab-back', {
              url: tabUrl.value,
              title: tabTitle.value,
              icon: tabIcon.value
            })
          }
          // 关闭当前窗口
          closeWindow()
        }

        // 刷新页面
        const refreshPage = () => {
          if (webview.value && webview.value.reload) {
            webview.value.reload()
          }
        }

        // 监听 webview 事件
        onMounted(() => {
          if (webview.value) {
            // 页面标题更新
            webview.value.addEventListener('page-title-updated', (e) => {
              tabTitle.value = e.title
              document.title = e.title
            })

            // 页面开始加载
            webview.value.addEventListener('did-start-loading', () => {
              isLoading.value = true
            })

            // 页面停止加载
            webview.value.addEventListener('did-stop-loading', () => {
              isLoading.value = false
            })

            // 页面加载完成
            webview.value.addEventListener('did-finish-load', () => {
              isLoading.value = false
              // 获取 favicon
              try {
                webview.value.executeJavaScript(`
                  (() => {
                    let link = document.querySelector('link[rel="icon"]') ||
                               document.querySelector('link[rel="shortcut icon"]') ||
                               document.querySelector('link[rel*="icon"]');
                    if (link && link.href) {
                      if (link.href.startsWith('//')) {
                        return location.protocol + link.href;
                      } else if (link.href.startsWith('/')) {
                        return location.origin + link.href;
                      } else if (!link.href.startsWith('http')) {
                        return new URL(link.href, location.href).href;
                      }
                      return link.href;
                    }
                    return null;
                  })()
                `).then(iconUrl => {
                  if (iconUrl) {
                    tabIcon.value = iconUrl
                  }
                }).catch(() => {})
              } catch (e) {}
            })

            // 页面加载失败
            webview.value.addEventListener('did-fail-load', () => {
              isLoading.value = false
            })
          }

          // 加载保存的主题设置
          const loadTheme = () => {
            const theme = localStorage.getItem('tdesign-theme')
            if (theme === 'dark') {
              document.documentElement.setAttribute('class', 'tdesign-theme__dark')
            }
          }
          loadTheme()

          // 初始化窗口状态
          updateWindowState()

          // 监听窗口大小变化，更新最大化状态
          window.addEventListener('resize', updateWindowState)

          // 监听主题变化
          if (window.electronAPI?.onMainMessage) {
            window.electronAPI.onMainMessage('theme-change', (theme) => {
              if (theme === 'dark') {
                document.documentElement.setAttribute('class', 'tdesign-theme__dark')
              } else {
                document.documentElement.setAttribute('class', '')
              }
              localStorage.setItem('tdesign-theme', theme)
            })
          }
        })

        return {
          tabUrl,
          tabTitle,
          tabIcon,
          isLoading,
          isMaximized,
          webview,
          minimizeWindow,
          maximizeWindow,
          toggleMaximize,
          closeWindow,
          mergeBackToMain,
          refreshPage
        }
      }
    }

    const app = createApp(App)
    app.use(TDesign)
    app.config.compilerOptions.isCustomElement = (tag) => tag === 'webview'
    app.mount('#app')
  </script>
</body>
</html>
