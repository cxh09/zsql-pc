<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字图传 - 智拾清澜工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231890ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='10' r='8'/%3E%3Ccircle cx='12' cy='10' r='3'/%3E%3Cpath d='M7 22h10'/%3E%3Cpath d='M12 22v-4'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="../libs/tdesign.min.css" />
  <style>
    /* 防止页面闪烁 - 在CSS加载完成前隐藏内容 */
    html { visibility: hidden; opacity: 0; }
    html.loaded { visibility: visible; opacity: 1; transition: opacity 0.2s ease; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--td-bg-color-page);
      min-height: 100vh;
      padding: 16px 24px;
    }

    #app { min-height: 100vh; }

    .page-header { margin-bottom: 20px; }
    .page-header h1 {
      font-size: 24px; font-weight: 600; color: var(--td-text-color-primary);
      display: flex; align-items: center; gap: 10px;
    }
    .page-header p { font-size: 14px; color: var(--td-text-color-secondary); margin-top: 4px; }

    .control-bar {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .control-bar .t-input__wrap { flex: 1; min-width: 160px; }

    .service-status { font-size: 13px; }
    .service-status.ok { color: var(--td-success-color); }
    .service-status.err { color: var(--td-error-color); }

    .adv-panel { margin-bottom: 16px; }
    .adv-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .adv-row .t-input { width: 220px; }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 900px) { .video-grid { grid-template-columns: 1fr; } }

    .video-panel {
      background: var(--td-bg-color-container);
      border: 1px solid var(--td-border-level-1-color);
      border-radius: 8px;
      overflow: hidden;
    }
    .video-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--td-border-level-1-color);
    }
    .cam-tag {
      font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 4px; color: #fff;
    }
    .cam-tag.cam0 { background: #3b82f6; }
    .cam-tag.cam1 { background: #f97316; }
    .cam-status { font-size: 13px; color: var(--td-text-color-secondary); }
    .cam-status.live { color: var(--td-success-color); }
    .cam-status.err { color: var(--td-error-color); }

    .video-area {
      position: relative; background: #000; aspect-ratio: 4 / 3;
      display: flex; align-items: center; justify-content: center;
      min-height: 220px; overflow: hidden;
    }
    .video-area img {
      width: 100%; height: 100%; object-fit: contain; display: block;
    }
    .video-placeholder {
      text-align: center; color: rgba(255,255,255,0.55); font-size: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .video-panel-footer {
      padding: 8px 14px; font-size: 12px; color: var(--td-text-color-secondary);
      display: flex; gap: 16px;
    }
    .video-panel-footer b { color: var(--td-text-color-primary); font-weight: 600; }

    .log-box {
      max-height: 180px; overflow-y: auto;
      background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px;
      font-size: 12px; line-height: 1.7; margin: 0;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <h1>数字图传</h1>
      <p>接收板卡双路 MJPG 视频流（UDP 50010）</p>
    </div>

    <!-- 控制栏 -->
    <div class="control-bar">
      <t-input v-model="boardIp" placeholder="板卡 IP" clearable size="large" style="max-width: 180px;">
        <template #prefixIcon><t-icon name="server" /></template>
      </t-input>
      <t-button theme="primary" size="large" :loading="connecting" :disabled="connecting" @click="handleConnect">
        <template #icon><t-icon name="play-circle" /></template>
        连接
      </t-button>
      <t-button theme="default" size="large" :disabled="!connected" @click="handleStop">
        <template #icon><t-icon name="stop-circle" /></template>
        断开
      </t-button>
      <span class="service-status" :class="serviceClass">{{ serviceText }}</span>
    </div>

    <!-- 高级设置 -->
    <div class="adv-panel">
      <t-collapse :default-value="[]">
        <t-collapse-panel header="高级设置" value="advanced">
          <div class="adv-row">
            <t-input v-model="boardPort" label="板卡 HTTP 端口" placeholder="8080" type="number" />
            <t-input v-model="udpPort" label="本地 UDP 接收端口" placeholder="50010" type="number" />
            <t-input v-model="dstIp" label="目标 IP（可选，走 /api/config）" placeholder="留空则用 /api/connect 一键连接" />
          </div>
        </t-collapse-panel>
      </t-collapse>
    </div>

    <!-- 双路视频 -->
    <div class="video-grid">
      <div class="video-panel">
        <div class="video-panel-header">
          <span class="cam-tag cam0">CAM 1</span>
          <span class="cam-status" :class="cam1Class">{{ cam1Status }}</span>
        </div>
        <div class="video-area">
          <img v-if="showCam0" :src="srcCam0" alt="CAM 1" />
          <div v-else class="video-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.55-2.28A1 1 0 0 1 21 8.62v6.76a1 1 0 0 1-1.45.9L15 14"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>
            <span>等待 CAM 1 视频流…</span>
          </div>
        </div>
        <div class="video-panel-footer">
          <span>帧率 <b>{{ fps0.toFixed(1) }} fps</b></span>
          <span>帧数 <b>{{ frames0 }}</b></span>
          <span>数据量 <b>{{ bytes0Text }}</b></span>
        </div>
      </div>

      <div class="video-panel">
        <div class="video-panel-header">
          <span class="cam-tag cam1">CAM 2</span>
          <span class="cam-status" :class="cam2Class">{{ cam2Status }}</span>
        </div>
        <div class="video-area">
          <img v-if="showCam1" :src="srcCam1" alt="CAM 2" />
          <div v-else class="video-placeholder">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.55-2.28A1 1 0 0 1 21 8.62v6.76a1 1 0 0 1-1.45.9L15 14"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>
            <span>等待 CAM 2 视频流…</span>
          </div>
        </div>
        <div class="video-panel-footer">
          <span>帧率 <b>{{ fps1.toFixed(1) }} fps</b></span>
          <span>帧数 <b>{{ frames1 }}</b></span>
          <span>数据量 <b>{{ bytes1Text }}</b></span>
        </div>
      </div>
    </div>

    <!-- 调试日志 -->
    <t-collapse :default-value="[]">
      <t-collapse-panel header="调试日志" value="logs">
        <pre class="log-box">{{ logText || '暂无日志' }}</pre>
      </t-collapse-panel>
    </t-collapse>
  </div>

  <script src="../libs/vue.global.js"></script>
  <script src="../libs/tdesign.min.js"></script>
  <script>
    const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

    // 与主进程本地服务通信(该页面运行在 webview 中,无 electronAPI,走 HTTP)
    const API_BASE = 'http://127.0.0.1:50110';

    function formatBytes(n) {
      if (!n) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      let v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return v.toFixed(1) + ' ' + units[i];
    }

    createApp({
      setup() {
        const boardIp = ref('192.168.29.10');
        const boardPort = ref('8080');
        const udpPort = ref('50010');
        const dstIp = ref('');

        const connected = ref(false);
        const connecting = ref(false);
        const serviceOk = ref(false);
        const serviceError = ref('');
        const serviceText = computed(() => {
          if (serviceOk.value) return '本地服务正常';
          return '本地服务不可用：' + serviceError.value;
        });
        const serviceClass = computed(() => (serviceOk.value ? 'ok' : 'err'));

        const srcCam0 = ref(''); const showCam0 = ref(false);
        const srcCam1 = ref(''); const showCam1 = ref(false);
        const fps0 = ref(0); const fps1 = ref(0);
        const frames0 = ref(0); const frames1 = ref(0);
        const bytes0 = ref(0); const bytes1 = ref(0);
        const bytes0Text = computed(() => formatBytes(bytes0.value));
        const bytes1Text = computed(() => formatBytes(bytes1.value));
        const cam1Status = computed(() => connected.value ? (showCam0.value ? '接收中' : '等待视频流…') : '未连接');
        const cam2Status = computed(() => connected.value ? (showCam1.value ? '接收中' : '等待视频流…') : '未连接');
        const cam1Class = computed(() => (showCam0.value ? 'live' : ''));
        const cam2Class = computed(() => (showCam1.value ? 'live' : ''));

        const logs = ref([]);
        const logText = computed(() => logs.value.join('\n'));
        function log(msg) {
          const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
          logs.value.push('[' + ts + '] ' + msg);
          if (logs.value.length > 200) logs.value.shift();
          console.log('[图传]', msg);
        }

        // ---- 流接收 ----
        let streamAbort = null;
        let fpsCounter0 = 0;
        let fpsCounter1 = 0;

        function concatBytes(a, b) {
          const out = new Uint8Array(a.length + b.length);
          out.set(a);
          out.set(b, a.length);
          return out;
        }

        function onFrame(stream, jpeg) {
          const url = URL.createObjectURL(new Blob([jpeg], { type: 'image/jpeg' }));
          if (stream === 1) {
            if (srcCam1.value) URL.revokeObjectURL(srcCam1.value);
            srcCam1.value = url;
            showCam1.value = true;
            frames1.value += 1;
            bytes1.value += jpeg.length;
            fpsCounter1 += 1;
          } else {
            if (srcCam0.value) URL.revokeObjectURL(srcCam0.value);
            srcCam0.value = url;
            showCam0.value = true;
            frames0.value += 1;
            bytes0.value += jpeg.length;
            fpsCounter0 += 1;
          }
        }

        async function connectStream() {
          const ctrl = new AbortController();
          streamAbort = ctrl;
          try {
            const resp = await fetch(API_BASE + '/stream', { signal: ctrl.signal });
            if (!resp.ok || !resp.body) throw new Error('流服务异常 HTTP ' + resp.status);
            const reader = resp.body.getReader();
            let buf = new Uint8Array(0);
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              if (value && value.length) buf = concatBytes(buf, value);
              // 帧格式: 1B stream + 4B 长度(大端) + JPEG
              while (buf.length >= 5) {
                const stream = buf[0];
                const len = (buf[1] << 24) | (buf[2] << 16) | (buf[3] << 8) | buf[4];
                if (len <= 0 || buf.length < 5 + len) break;
                onFrame(stream, buf.slice(5, 5 + len));
                buf = buf.subarray(5 + len);
              }
            }
          } catch (e) {
            if (e && e.name !== 'AbortError') log('视频流连接中断: ' + e.message);
          } finally {
            streamAbort = null;
          }
        }

        // ---- 控制 ----
        async function handleConnect() {
          connecting.value = true;
          try {
            const payload = {
              boardIp: boardIp.value.trim(),
              boardPort: Number(boardPort.value) || 8080,
              udpPort: Number(udpPort.value) || 50010
            };
            if (dstIp.value.trim()) payload.dst = dstIp.value.trim();
            log('正在连接板卡 ' + payload.boardIp + ' …');
            const resp = await fetch(API_BASE + '/api/connect', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || !data.ok) {
              log('连接失败: ' + (data.error || data.detail || ('HTTP ' + resp.status)));
              return;
            }
            log('连接成功，本地 UDP 端口: ' + data.udpPort);
            log('板卡响应: ' + (data.board && data.board.text));
            connected.value = true;
            connectStream();
          } catch (e) {
            log('连接异常: ' + (e && e.message));
          } finally {
            connecting.value = false;
          }
        }

        async function handleStop() {
          if (streamAbort) {
            streamAbort.abort();
            streamAbort = null;
          }
          try {
            await fetch(API_BASE + '/api/stop', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: '{}'
            });
          } catch (e) {
            log('断开请求失败: ' + (e && e.message));
          }
          connected.value = false;
          if (srcCam0.value) URL.revokeObjectURL(srcCam0.value);
          if (srcCam1.value) URL.revokeObjectURL(srcCam1.value);
          srcCam0.value = ''; srcCam1.value = '';
          showCam0.value = false; showCam1.value = false;
          frames0.value = 0; frames1.value = 0;
          bytes0.value = 0; bytes1.value = 0;
          log('已断开');
        }

        async function pingService() {
          try {
            const ctrl = new AbortController();
            setTimeout(() => ctrl.abort(), 2000);
            const resp = await fetch(API_BASE + '/api/ping', { signal: ctrl.signal });
            const data = await resp.json().catch(() => ({}));
            serviceOk.value = resp.ok && !!data.ok;
            if (!serviceOk.value) serviceError.value = '服务响应异常';
            return serviceOk.value;
          } catch (e) {
            serviceOk.value = false;
            serviceError.value = (e && e.name === 'AbortError') ? '连接超时' : (e && e.message);
            return false;
          }
        }

        // 每秒统计帧率
        let fpsTimer = setInterval(() => {
          fps0.value = fpsCounter0;
          fps1.value = fpsCounter1;
          fpsCounter0 = 0;
          fpsCounter1 = 0;
        }, 1000);

        onMounted(async () => {
          document.documentElement.classList.add('loaded');
          const ok = await pingService();
          if (ok) log('本地服务已就绪');
          else log('本地服务不可用，请重启应用或检查 127.0.0.1:' + (API_BASE.split(':').pop() || 50110));
        });

        onUnmounted(() => {
          if (streamAbort) streamAbort.abort();
          clearInterval(fpsTimer);
          // 尽力通知主进程停止(页面被关闭时)
          try {
            fetch(API_BASE + '/api/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
          } catch (e) { /* ignore */ }
        });

        return {
          boardIp, boardPort, udpPort, dstIp,
          connected, connecting, serviceOk, serviceError, serviceText, serviceClass,
          srcCam0, showCam0, srcCam1, showCam1,
          fps0, fps1, frames0, frames1, bytes0Text, bytes1Text,
          cam1Status, cam2Status, cam1Class, cam2Class,
          logs, logText,
          handleConnect, handleStop
        };
      }
    }).use(TDesign).mount('#app');
  </script>
</body>
</html>
